<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Ninja Tracker 🥷</title>
  <style>
    /* ───── CSS Variables ───── */
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface2: #f0f2f8;
      --border: #e1e5ef;
      --text: #1a1d2e;
      --text2: #5a6278;
      --text3: #8a91a8;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --tag-bg: #ede9fe;
      --tag-text: #6c63ff;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #242740;
      --border: #2e3150;
      --text: #e8eaf6;
      --text2: #9fa3c0;
      --text3: #5c6080;
      --accent: #a78bfa;
      --accent2: #6c63ff;
      --tag-bg: #2a2550;
      --tag-text: #a78bfa;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* ───── Reset & Base ───── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    textarea, input { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ───── Header ───── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .logo span { opacity: 0.7; }
    .header-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .stat-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .stat-badge.green { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
    .stat-badge.red { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .stat-badge.yellow { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    [data-theme="dark"] .stat-badge.green { background: #064e3b; color: #6ee7b7; border-color: #065f46; }
    [data-theme="dark"] .stat-badge.red { background: #450a0a; color: #fca5a5; border-color: #991b1b; }
    [data-theme="dark"] .stat-badge.yellow { background: #451a03; color: #fcd34d; border-color: #92400e; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all var(--transition);
    }
    .btn-icon:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* ───── Main Layout ───── */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* ───── Controls Bar ───── */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      transition: all var(--transition);
    }
    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .sort-select {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      outline: none;
      cursor: pointer;
      margin-left: auto;
    }
    .sort-select:focus { border-color: var(--accent); }
    .last-scan {
      font-size: 12px;
      color: var(--text3);
      margin-left: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .scan-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ───── Empty State ───── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 18px; color: var(--text2); margin-bottom: 6px; }

    /* ───── Job Cards ───── */
    .cards-grid {
      display: grid;
      gap: 16px;
    }
    .job-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all var(--transition);
      position: relative;
    }
    .job-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .job-card.status-interested { border-left: 4px solid var(--green); }
    .job-card.status-not_interested { border-left: 4px solid var(--red); opacity: 0.65; }
    .job-card.status-seen { border-left: 4px solid var(--yellow); }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 18px 14px;
    }
    .company-logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .company-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .card-title-block { flex: 1; min-width: 0; }
    .card-company {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text2);
    }
    .card-meta-item { display: flex; align-items: center; gap: 3px; }
    .type-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .verified-badge {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
    }

    /* Status indicator top-right */
    .status-indicator {
      position: absolute;
      top: 14px; right: 14px;
      font-size: 18px;
      line-height: 1;
    }

    /* Tags */
    .card-tags {
      padding: 0 18px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--tag-bg);
      color: var(--tag-text);
    }

    /* Screenshot */
    .card-screenshot {
      margin: 0 18px 12px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      max-height: 200px;
    }
    .card-screenshot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Action buttons */
    .card-actions {
      padding: 12px 18px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }
    .action-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid transparent;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .action-btn.interested {
      background: #d1fae5; color: #065f46; border-color: #a7f3d0;
    }
    .action-btn.interested:hover, .action-btn.interested.active {
      background: var(--green); color: white; border-color: var(--green);
    }
    .action-btn.not-interested {
      background: #fee2e2; color: #991b1b; border-color: #fca5a5;
    }
    .action-btn.not-interested:hover, .action-btn.not-interested.active {
      background: var(--red); color: white; border-color: var(--red);
    }
    .action-btn.seen {
      background: #fef3c7; color: #92400e; border-color: #fcd34d;
    }
    .action-btn.seen:hover, .action-btn.seen.active {
      background: var(--yellow); color: white; border-color: var(--yellow);
    }
    [data-theme="dark"] .action-btn.interested { background: #064e3b; color: #6ee7b7; border-color: #065f46; }
    [data-theme="dark"] .action-btn.not-interested { background: #450a0a; color: #fca5a5; border-color: #991b1b; }
    [data-theme="dark"] .action-btn.seen { background: #451a03; color: #fcd34d; border-color: #92400e; }
    .btn-link {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-link:hover { border-color: var(--accent); color: var(--accent); }

    /* Notes section */
    .card-notes {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }
    .notes-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text3);
      cursor: pointer;
      padding: 0;
      width: 100%;
      text-align: left;
      transition: color var(--transition);
    }
    .notes-toggle:hover { color: var(--accent); }
    .notes-toggle .chevron { transition: transform var(--transition); font-size: 10px; }
    .notes-toggle.open .chevron { transform: rotate(180deg); }
    .notes-body {
      margin-top: 10px;
      display: none;
    }
    .notes-body.open { display: block; }
    .notes-row {
      margin-bottom: 10px;
    }
    .notes-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text3);
      margin-bottom: 4px;
    }
    .notes-textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      resize: vertical;
      transition: border-color var(--transition);
      outline: none;
    }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-textarea[dir="rtl"] { font-size: 14px; }
    .notes-save-btn {
      margin-top: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      font-size: 12px;
      font-weight: 700;
      border: none;
      transition: opacity var(--transition);
    }
    .notes-save-btn:hover { opacity: 0.85; }

    /* Posted date / days ago */
    .days-ago {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text3);
    }
    .days-ago.fresh { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
    .days-ago.recent { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .days-ago.old { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    [data-theme="dark"] .days-ago.fresh { background: #064e3b; color: #6ee7b7; border-color: #065f46; }
    [data-theme="dark"] .days-ago.recent { background: #451a03; color: #fcd34d; border-color: #92400e; }
    [data-theme="dark"] .days-ago.old { background: #450a0a; color: #fca5a5; border-color: #991b1b; }

    /* ───── Reset confirm modal ───── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 360px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
    }
    .modal h3 { font-size: 18px; margin-bottom: 8px; }
    .modal p { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-btn {
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      transition: all var(--transition);
    }
    .modal-btn.danger { background: var(--red); color: white; border-color: var(--red); }
    .modal-btn:hover { opacity: 0.85; }

    /* ───── Toast ───── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: var(--surface);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 300;
      transition: transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ───── Responsive ───── */
    @media (max-width: 600px) {
      .header-stats { display: none; }
      .card-actions { flex-wrap: wrap; }
      .action-btn { min-width: calc(33% - 6px); }
    }
  </style>
</head>
<body data-theme="light">

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="logo">🥷 <span>Job Ninja</span></div>
    <div class="header-stats" id="headerStats"></div>
    <div class="header-actions">
      <button class="btn-icon" id="themeToggle" title="Toggle dark/light mode">🌙</button>
      <button class="btn-icon" id="resetBtn" title="Reset all statuses">🔄</button>
    </div>
  </div>
</header>

<!-- Main -->
<main class="main">
  <!-- Controls -->
  <div class="controls">
    <button class="filter-btn active" data-filter="all">All Jobs</button>
    <button class="filter-btn" data-filter="new">🆕 New</button>
    <button class="filter-btn" data-filter="interested">✅ Interested</button>
    <button class="filter-btn" data-filter="seen">👁️ Seen</button>
    <button class="filter-btn" data-filter="not_interested">❌ Not Interested</button>
    <select class="sort-select" id="sortSelect">
      <option value="date-desc">Newest first</option>
      <option value="date-asc">Oldest first</option>
      <option value="company">Company A–Z</option>
    </select>
    <div class="last-scan" id="lastScan"></div>
  </div>

  <!-- Cards -->
  <div class="cards-grid" id="cardsGrid"></div>

  <!-- Empty state (hidden by default) -->
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="emoji">🥷</div>
    <h3>No jobs here</h3>
    <p>Try a different filter</p>
  </div>
</main>

<!-- Reset modal -->
<div class="modal-backdrop" id="resetModal">
  <div class="modal">
    <h3>Reset All Statuses?</h3>
    <p>This will clear all votes and notes. This cannot be undone.</p>
    <div class="modal-actions">
      <button class="modal-btn" id="resetCancel">Cancel</button>
      <button class="modal-btn danger" id="resetConfirm">Reset Everything</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ──────────────────────────────────────────────────
//  Constants & seed data
// ──────────────────────────────────────────────────
const STORAGE_KEY = 'job-ninja-state-v1';
const SCAN_KEY = 'job-ninja-last-scan';

const SEED_JOBS = [

    tags: ["field-marketing", "AI", "cloud"],

  },
  {
    id: "oracle-fmm",
    company: "Oracle",
    title: "Field Marketing & Programs Specialist",
    location: "Petah Tikva",
    url: "https://il.linkedin.com/jobs/view/marketing-specialist-at-oracle-4069622342",
    tags: ["field-marketing", "enterprise"],

    type: "Large company",
    verified: false,
    screenshot: null
  }
];

// ──────────────────────────────────────────────────
//  State management
// ──────────────────────────────────────────────────
let state = {};      // { [jobId]: { status, jobNote, companyNote } }
let jobs = [];       // merged seed + any fetched from jobs.json
let currentFilter = 'all';
let currentSort = 'date-desc';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch { state = {}; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getJobState(id) {
  return state[id] || { status: 'new', jobNote: '', companyNote: '' };
}

function setJobState(id, updates) {
  state[id] = { ...getJobState(id), ...updates };
  saveState();
}

// ──────────────────────────────────────────────────
//  Theme
// ──────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('job-ninja-theme') || 'light';
  document.body.dataset.theme = saved;
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = next;
  localStorage.setItem('job-ninja-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});

// ──────────────────────────────────────────────────
//  Utilities
// ──────────────────────────────────────────────────
function daysAgo(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
  if (diff === 0) return 'Today';
  if (diff === 1) return '1 day ago';
  return `${diff}d ago`;
}

function daysAgoClass(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
  if (diff <= 7) return 'fresh';
  if (diff <= 21) return 'recent';
  return 'old';
}

function getLogoUrl(company) {
  const domain = {
    'Taboola': 'taboola.com',
    'CyCognito': 'cycognito.com',
    'Classiq': 'classiq.io',
    'Nebius': 'nebius.com',
    'Oracle': 'oracle.com',
  };
  const d = domain[company];
  if (d) return `https://logo.clearbit.com/${d}`;
  return null;
}

function getFaviconUrl(url) {
  try {
    const u = new URL(url);
    return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
  } catch { return null; }
}

function statusEmoji(status) {
  const map = { interested: '✅', not_interested: '❌', seen: '👁️', new: '' };
  return map[status] || '';
}

function isRtl(text) {
  // Detect Hebrew characters
  return /[\u0590-\u05FF]/.test(text);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ──────────────────────────────────────────────────
//  Stats
// ──────────────────────────────────────────────────
function renderStats() {
  const total = jobs.length;
  const interested = jobs.filter(j => getJobState(j.id).status === 'interested').length;
  const notInt = jobs.filter(j => getJobState(j.id).status === 'not_interested').length;
  const seen = jobs.filter(j => getJobState(j.id).status === 'seen').length;
  const newCount = jobs.filter(j => getJobState(j.id).status === 'new').length;

  document.getElementById('headerStats').innerHTML = `
    <span class="stat-badge">${total} total</span>
    <span class="stat-badge" style="background:var(--surface2)">${newCount} new</span>
    <span class="stat-badge green">${interested} interested</span>
    <span class="stat-badge yellow">${seen} seen</span>
    <span class="stat-badge red">${notInt} skipped</span>
  `;
}

// ──────────────────────────────────────────────────
//  Last scan indicator
// ──────────────────────────────────────────────────
function renderLastScan() {
  const ts = localStorage.getItem(SCAN_KEY);
  const el = document.getElementById('lastScan');
  if (ts) {
    const d = new Date(ts);
    el.innerHTML = `<span class="scan-dot"></span> Last scan: ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  } else {
    // Set "now" as first scan time if not set
    const now = new Date().toISOString();
    localStorage.setItem(SCAN_KEY, now);
    el.innerHTML = `<span class="scan-dot"></span> Last scan: just now`;
  }
}

// ──────────────────────────────────────────────────
//  Card rendering
// ──────────────────────────────────────────────────
function buildCard(job) {
  const s = getJobState(job.id);
  const logoUrl = getLogoUrl(job.company);
  const fallbackUrl = getFaviconUrl(job.url);
  const da = daysAgo(job.postedDate);
  const daClass = daysAgoClass(job.postedDate);
  const em = statusEmoji(s.status);

  const tagsHtml = (job.tags || []).map(t =>
    `<span class="tag">#${escHtml(t)}</span>`
  ).join('');

  const screenshotHtml = job.screenshot
    ? `<div class="card-screenshot"><img src="${escHtml(job.screenshot)}" alt="Screenshot" loading="lazy" /></div>`
    : '';

  const noteDir = isRtl(s.jobNote) ? 'rtl' : 'ltr';
  const coNoteDir = isRtl(s.companyNote) ? 'rtl' : 'ltr';

  const hasNotes = s.jobNote || s.companyNote;

  return `
<div class="job-card status-${s.status}" id="card-${job.id}" data-id="${job.id}">
  ${em ? `<div class="status-indicator">${em}</div>` : ''}
  <div class="card-header">
    <div class="company-logo" id="logo-${job.id}">
      ${logoUrl
        ? `<img src="${escHtml(logoUrl)}" alt="${escHtml(job.company)}" onerror="this.parentNode.innerHTML='${job.company.charAt(0)}'" />`
        : `<img src="${escHtml(fallbackUrl || '')}" alt="${escHtml(job.company)}" onerror="this.parentNode.innerHTML='${job.company.charAt(0)}'" />`
      }
    </div>
    <div class="card-title-block">
      <div class="card-company">${escHtml(job.company)}</div>
      <div class="card-title">${escHtml(job.title)}</div>
      <div class="card-meta">
        <span class="card-meta-item">📍 ${escHtml(job.location)}</span>
        <span class="type-badge">${escHtml(job.type)}</span>
        ${job.verified ? `<span class="verified-badge">✔ Verified</span>` : ''}
        <span class="days-ago ${daClass}">${escHtml(da)}</span>
      </div>
    </div>
  </div>
  ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
  ${screenshotHtml}
  <div class="card-actions">
    <button class="action-btn interested ${s.status === 'interested' ? 'active' : ''}"
      onclick="setStatus('${job.id}','interested')">✅ Interested</button>
    <button class="action-btn not-interested ${s.status === 'not_interested' ? 'active' : ''}"
      onclick="setStatus('${job.id}','not_interested')">❌ Skip</button>
    <button class="action-btn seen ${s.status === 'seen' ? 'active' : ''}"
      onclick="setStatus('${job.id}','seen')">👁️ Applied</button>
    <a class="btn-link" href="${escHtml(job.url)}" target="_blank" rel="noopener">🔗 View</a>
  </div>
  <div class="card-notes">
    <button class="notes-toggle ${hasNotes ? 'open' : ''}" onclick="toggleNotes('${job.id}', this)">
      📝 Notes ${hasNotes ? '(saved)' : ''} <span class="chevron">▼</span>
    </button>
    <div class="notes-body ${hasNotes ? 'open' : ''}" id="notes-body-${job.id}">
      <div class="notes-row">
        <div class="notes-label">Job Note</div>
        <textarea class="notes-textarea" id="job-note-${job.id}"
          dir="${noteDir}"
          placeholder="Add a note about this role..."
          oninput="this.setAttribute('dir', /[\\u0590-\\u05FF]/.test(this.value) ? 'rtl' : 'ltr')"
        >${escHtml(s.jobNote || '')}</textarea>
      </div>
      <div class="notes-row">
        <div class="notes-label">Why I like ${escHtml(job.company)}</div>
        <textarea class="notes-textarea" id="company-note-${job.id}"
          dir="${coNoteDir}"
          placeholder="Why this company interests you..."
          oninput="this.setAttribute('dir', /[\\u0590-\\u05FF]/.test(this.value) ? 'rtl' : 'ltr')"
        >${escHtml(s.companyNote || '')}</textarea>
      </div>
      <button class="notes-save-btn" onclick="saveNotes('${job.id}')">Save Notes</button>
    </div>
  </div>
</div>`;
}

function toggleNotes(id, btn) {
  btn.classList.toggle('open');
  document.getElementById(`notes-body-${id}`).classList.toggle('open');
}

function setStatus(id, status) {
  const s = getJobState(id);
  // Toggle: clicking same status resets to "new"
  const newStatus = s.status === status ? 'new' : status;
  setJobState(id, { status: newStatus });
  renderAll();
  const labels = { interested: '✅ Marked Interested', not_interested: '❌ Skipped', seen: '👁️ Marked as Applied', new: '↩️ Reset' };
  showToast(labels[newStatus] || 'Updated');
}

function saveNotes(id) {
  const jobNote = document.getElementById(`job-note-${id}`)?.value || '';
  const companyNote = document.getElementById(`company-note-${id}`)?.value || '';
  setJobState(id, { jobNote, companyNote });
  // Update toggle label without full re-render
  const toggle = document.querySelector(`#card-${id} .notes-toggle`);
  if (toggle) {
    const hasNotes = jobNote || companyNote;
    toggle.innerHTML = `📝 Notes ${hasNotes ? '(saved)' : ''} <span class="chevron">▼</span>`;
    if (hasNotes) toggle.classList.add('open');
  }
  showToast('📝 Notes saved!');
}

// ──────────────────────────────────────────────────
//  Filter & Sort
// ──────────────────────────────────────────────────
function getFilteredSorted() {
  let list = [...jobs];

  // Filter
  if (currentFilter !== 'all') {
    list = list.filter(j => {
      const s = getJobState(j.id).status;
      if (currentFilter === 'new') return s === 'new';
      return s === currentFilter;
    });
  }

  // Sort
  list.sort((a, b) => {
    if (currentSort === 'date-desc') return new Date(b.postedDate) - new Date(a.postedDate);
    if (currentSort === 'date-asc') return new Date(a.postedDate) - new Date(b.postedDate);
    if (currentSort === 'company') return a.company.localeCompare(b.company);
    return 0;
  });

  return list;
}

// ──────────────────────────────────────────────────
//  Main render
// ──────────────────────────────────────────────────
function renderAll() {
  const list = getFilteredSorted();
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = list.map(buildCard).join('');
  }

  renderStats();
}

// ──────────────────────────────────────────────────
//  Filter buttons
// ──────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAll();
  });
});

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  renderAll();
});

// ──────────────────────────────────────────────────
//  Reset
// ──────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('resetModal').classList.add('open');
});
document.getElementById('resetCancel').addEventListener('click', () => {
  document.getElementById('resetModal').classList.remove('open');
});
document.getElementById('resetConfirm').addEventListener('click', () => {
  state = {};
  saveState();
  document.getElementById('resetModal').classList.remove('open');
  renderAll();
  showToast('🔄 All statuses reset');
});

// ──────────────────────────────────────────────────
//  Toast
// ──────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ──────────────────────────────────────────────────
//  Load jobs from jobs.json (with fallback to seed)
// ──────────────────────────────────────────────────
async function loadJobs() {
  try {
    const res = await fetch('jobs.json', { cache: 'no-store' });
    if (res.ok) {
      const fetched = await res.json();
      if (Array.isArray(fetched) && fetched.length > 0) {
        // Merge: keep seed jobs, add any new ones from file
        const ids = new Set(fetched.map(j => j.id));
        const extras = SEED_JOBS.filter(j => !ids.has(j.id));
        jobs = [...fetched, ...extras];
        localStorage.setItem(SCAN_KEY, new Date().toISOString());
        return;
      }
    }
  } catch (e) { /* fall through to seed */ }
  jobs = [...SEED_JOBS];
}

// ──────────────────────────────────────────────────
//  Init
// ──────────────────────────────────────────────────
(async () => {
  initTheme();
  loadState();
  await loadJobs();
  renderLastScan();
  renderAll();
})();
</script>
</body>
</html>
